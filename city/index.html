<style>

<header><h1>AGENT CITY</h1><span class="s"><a href="../">dashboard</a> · <span id="t">CONNECTING</span></span></header>

<div class="p"><h2>MORNING BRIEF</h2><h3>WAITING ON YOU</h3><div id="wait"></div><h3>QUEUED TODAY</h3><div id="queue"></div><h3>WHILE YOU SLEPT</h3><div id="slept"></div></div>

<script>
const C={bro:"#58a6ff","trench dig":"#d29922",advisor:"#a371f7",player:"#3fb950"},NM={bro:"Bro","trench dig":"trench dig",advisor:"advisor",player:"player"};
// iso grid positions (gx,gy), height, footprint
const BL={bro:{g:[0,0],h:220,w:46,lab:"OVERSEER"},advisor:{g:[-3,-2],h:170,w:34,lab:"RISK"},player:{g:[3,-2],h:110,w:56,lab:"TRADER"},"trench dig":{g:[0,3.2],h:55,w:40,lab:"SCOUT"}};
const fill=[];for(let i=-6;i<=6;i++)for(let j=-6;j<=6;j++){if(Math.random()<.35&&!Object.values(BL).some(b=>Math.hypot(b.g[0]-i,b.g[1]-j)<1.6))fill.push({g:[i,j],h:20+Math.random()*90,w:22+Math.random()*16,s:Math.random()})}
fill.sort((a,b)=>(a.g[0]+a.g[1])-(b.g[0]+b.g[1]));
const cv=document.getElementById("c"),x=cv.getContext("2d");let W,H,d=devicePixelRatio,cam={x:0,y:0,z:1},S={},seen=new Set(),pk=[],first=true,vf=0,lt=null,flare=0,hit=[];
const drops=Array.from({length:matchMedia("(max-width:600px)").matches?110:180},()=>({x:Math.random(),y:Math.random(),v:.6+Math.random()*.6}));
function rs(){const r=cv.getBoundingClientRect();W=cv.width=r.width*d;H=cv.height=r.height*d;cam.z=Math.min(1.2,Math.max(.5,Math.min(r.width/640,r.height/600)))}addEventListener("resize",rs);
const iso=(gx,gy)=>[W/2+cam.x+(gx-gy)*44*d*cam.z,H*.76+cam.y+(gx+gy)*24*d*cam.z];

const stars=Array.from({length:70},()=>({x:Math.random(),y:Math.random()*.45,p:Math.random()*6}));

const RD=[[1.6,0],[-1.6,1]];// road along gx (gy fixed) / along gy (gx fixed)
const cars=Array.from({length:7},(_,i)=>({r:i%2,u:Math.random()*14-7,v:(Math.random()<.5?-1:1)*(.012+Math.random()*.012),cop:i<2}));

const vents=[[-4,1.6],[2.5,1.6],[-1.6,-4],[-1.6,3.5]],lamps=[];for(let i=-6;i<=6;i+=2){lamps.push([i,1.25,0],[-1.25,i,1])}
const neon=fill.filter((f,i)=>i%6==0).slice(0,7).map((f,i)=>({f,c:["#f85149","#58a6ff","#d2a8ff","#e3b341"][i%4],t:["BAR","PAWN","24H","HOTEL","CASH","GIN","DINER"][i]}));
const rp=(r,u,o=0)=>r==0?iso(u,RD[0][0]+o):iso(RD[1][0]+o,u);
let vig={t0:performance.now()+3000,ph:-1};
function sky(t){const mx=W*.78,my=H*.12;const mg=x.createRadialGradient(mx,my,0,mx,my,90*d);mg.addColorStop(0,"#d8dee955");mg.addColorStop(1,"#d8dee900");x.fillStyle=mg;x.fillRect(mx-90*d,my-90*d,180*d,180*d);x.fillStyle="#cdd5df";x.beginPath();x.arc(mx,my,20*d,0,7);x.fill();x.fillStyle="#0b1019";x.beginPath();x.arc(mx+8*d,my-5*d,18*d,0,7);x.fill();

function street(t){x.lineCap="round";for(const[r]of [[0],[1]]){const a=rp(r,-7),b=rp(r,7);x.strokeStyle="#0f141b";x.lineWidth=26*d*cam.z;x.beginPath();x.moveTo(...a);x.lineTo(...b);x.stroke();x.setLineDash([6*d,10*d]);x.strokeStyle="#3a3f2a";x.lineWidth=1*d;x.beginPath();x.moveTo(...a);x.lineTo(...b);x.stroke();x.setLineDash([])}
for(const[i,j,r]of lamps){const[px,py]=iso(i,j),on=Math.sin(t/90+i*7+j*3)>-.92||(i+j)%4;if(!on)continue;const g=x.createRadialGradient(px,py,0,px,py,26*d*cam.z);g.addColorStop(0,"#e3b34155");g.addColorStop(1,"#e3b34100");x.fillStyle=g;x.fillRect(px-26*d,py-26*d,52*d,52*d);x.fillStyle="#f0d080";x.fillRect(px-1*d,py-14*d*cam.z,2*d,2*d)}
for(const[i,j]of vents){const[px,py]=iso(i,j);for(let k=0;k<4;k++){const ph=((t/1600+k/4+i+10)%1);x.fillStyle=`rgba(180,190,205,${.18*(1-ph)})`;x.beginPath();x.arc(px+Math.sin(ph*6+k)*4*d,py-ph*40*d*cam.z,(4+ph*12)*d*cam.z,0,7);x.fill()}}
for(const c of cars){c.u+=c.v*(c.cop&&vig.ph==1?1.8:1);if(c.u>7)c.u=-7;if(c.u<-7)c.u=7;const o=c.v>0?.18:-.18,[px,py]=rp(c.r,c.u,o),[qx,qy]=rp(c.r,c.u+Math.sign(c.v)*.25,o);
const ang=Math.atan2(qy-py,qx-px);x.save();x.translate(px,py);x.rotate(ang);x.fillStyle=c.cop?"#1b2533":"#20262e";x.fillRect(-8*d*cam.z,-4*d*cam.z,16*d*cam.z,8*d*cam.z);
const hl=x.createLinearGradient(8*d,0,48*d*cam.z,0);hl.addColorStop(0,"#fff6d066");hl.addColorStop(1,"#fff6d000");x.fillStyle=hl;x.beginPath();x.moveTo(8*d*cam.z,-3*d);x.lineTo(48*d*cam.z,-12*d*cam.z);x.lineTo(48*d*cam.z,12*d*cam.z);x.lineTo(8*d*cam.z,3*d);x.fill();
x.fillStyle="#ff3b30";x.fillRect(-9*d*cam.z,-3*d*cam.z,2*d,2*d);x.fillRect(-9*d*cam.z,2*d*cam.z,2*d,2*d);
if(c.cop){const f=Math.sin(t/90)>0;x.fillStyle=f?"#f85149":"#58a6ff";x.shadowColor=x.fillStyle;x.shadowBlur=16*d;x.fillRect(-2*d,-3*d*cam.z,4*d,6*d*cam.z);x.shadowBlur=0}x.restore()}
const scat=vig.ph>=1;for(const g of thugs){if(scat&&!g.run){g.run=1;g.v=(Math.random()<.5?-1:1)*.03}if(!scat&&g.run){g.run=0;g.v=0}if(g.run)g.u+=g.v;else g.u+=Math.sin(t/3000+g.o*9)*.002;if(g.u>7)g.u=-7;if(g.u<-7)g.u=7;
const[px,py]=rp(g.r,g.u,g.o),b=g.run?Math.abs(Math.sin(t/60))*2*d:0;x.fillStyle="#020304";x.fillRect(px-1.5*d,py-9*d*cam.z-b,3*d*cam.z,7*d*cam.z);x.beginPath();x.arc(px,py-11*d*cam.z-b,2*d*cam.z,0,7);x.fill();x.fillStyle="#f8514999";x.fillRect(px+.5*d,py-11.5*d*cam.z-b,1*d,1*d)}
// mugging in the alley by the scout + cop chasing
const[mx,my]=iso(-2.6,2.6);if(!scat){const lean=Math.sin(t/300)*2*d;x.fillStyle="#020304";x.fillRect(mx,my-10*d,3*d,9*d);x.beginPath();x.arc(mx+1.5*d,my-12*d,2.2*d,0,7);x.fill();x.fillRect(mx+5*d+lean,my-10*d,3*d,9*d);x.beginPath();x.arc(mx+6.5*d+lean,my-12*d,2.2*d,0,7);x.fill();x.fillRect(mx+3*d,my-8*d,3*d+lean,1*d)}
const ch=(t/9000)%1,[c1x,c1y]=rp(0,-6+ch*12,-.3),[c2x,c2y]=rp(0,-6.6+ch*12,-.3);x.fillStyle="#020304";x.fillRect(c1x,c1y-9*d,3*d,8*d);x.fillStyle="#1f3b66";x.fillRect(c2x,c2y-9*d,3*d,8*d);x.fillStyle=Math.sin(t/120)>0?"#58a6ff":"#1f3b66";x.fillRect(c2x,c2y-12*d,3*d,2*d)}
function neonDraw(t){for(const n of neon){const[px,py]=iso(...n.f.g),on=Math.sin(t/(170+n.t.length*20))>-.85;if(!on)continue;x.font=`bold ${8*d*cam.z}px monospace`;x.textAlign="center";x.fillStyle=n.c;x.shadowColor=n.c;x.shadowBlur=10*d;x.fillText(n.t,px,py-n.f.h*d*cam.z*.45);x.shadowBlur=0}}
function cape(px,py,sc,glide){x.save();x.translate(px,py);x.scale(sc*d*cam.z,sc*d*cam.z);x.fillStyle="#010102";x.beginPath();
if(glide){x.moveTo(0,-3);x.quadraticCurveTo(-14,-6,-26,4);x.quadraticCurveTo(-18,1,-14,6);x.quadraticCurveTo(-7,2,0,6);x.quadraticCurveTo(7,2,14,6);x.quadraticCurveTo(18,1,26,4);x.quadraticCurveTo(14,-6,0,-3);x.fill();x.beginPath();x.arc(0,-4,2.5,0,7);x.fill()}

function vigilante(t,tops){const e=t-vig.t0;if(e<0){vig.ph=-1;return}const[ax,ay]=tops.advisor,P=3500,G=2500;
if(e<P){vig.ph=0;const a=Math.min(1,e/400);x.globalAlpha=a;cape(ax,ay-2*d,1,false);x.fillStyle="#010102";x.fillRect(ax-8*d,ay-1*d,16*d,3*d);x.globalAlpha=1}
else if(e<P+G){vig.ph=1;const k=(e-P)/G;cape(ax+(W*1.1-ax)*k*k,ay-k*60*d+Math.sin(k*9)*6*d,1.4,true)}
else{vig.ph=-1;vig.t0=t+7000+Math.random()*3000}}

function box(px,py,w,h,top,l,r,win){w*=d*cam.z;h*=d*cam.z;const hw=w/2,q=w/4;
x.fillStyle=l;x.beginPath();x.moveTo(px-hw,py);x.lineTo(px,py+q);x.lineTo(px,py+q-h);x.lineTo(px-hw,py-h);x.fill();
x.fillStyle=r;x.beginPath();x.moveTo(px+hw,py);x.lineTo(px,py+q);x.lineTo(px,py+q-h);x.lineTo(px+hw,py-h);x.fill();
x.fillStyle=top;x.beginPath();x.moveTo(px,py-h-q);x.lineTo(px+hw,py-h);x.lineTo(px,py-h+q);x.lineTo(px-hw,py-h);x.fill();
if(win){x.fillStyle=win;for(let yy=8*d;yy<h-6*d;yy+=11*d*cam.z)for(let k=.2;k<.95;k+=.25){if(((yy*13+k*97)|0)%3)continue;const wx=px-hw+k*hw,wy=py-yy+k*q;x.fillRect(wx,wy,3*d*cam.z,4*d*cam.z)}}return [px-hw,py-h-q,w,h+2*q]}
function draw(t){const lv=S.risk_level||"green";
const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"#0b1019");g.addColorStop(1,"#04060a");x.fillStyle=g;x.fillRect(0,0,W,H);sky(t);
for(const [o,s] of [[.15,1],[.85,-1]]){const a=-Math.PI/2+Math.sin(t/2600*s)*.55;x.save();x.translate(W*o,H);x.rotate(a);const lg=x.createLinearGradient(0,0,H*1.3,0);lg.addColorStop(0,"#ffffff1c");lg.addColorStop(1,"#ffffff00");x.fillStyle=lg;x.beginPath();x.moveTo(0,0);x.lineTo(H*1.3,-70*d);x.lineTo(H*1.3,70*d);x.fill();x.restore()}
// ground grid
x.strokeStyle="#111821";x.lineWidth=1;for(let i=-7;i<=7;i++){let[a,b]=iso(i,-7),[c,e]=iso(i,7);x.beginPath();x.moveTo(a,b);x.lineTo(c,e);x.stroke();[a,b]=iso(-7,i);[c,e]=iso(7,i);x.beginPath();x.moveTo(a,b);x.lineTo(c,e);x.stroke()}
street(t);
// siren street glow
const sc=Math.sin(t/260)>0?"248,81,73":"88,166,255",[sx,sy]=iso(2,4.5);const rg=x.createRadialGradient(sx,sy,0,sx,sy,120*d);rg.addColorStop(0,`rgba(${sc},.25)`);rg.addColorStop(1,"rgba(0,0,0,0)");x.fillStyle=rg;x.fillRect(0,0,W,H);
// draw buildings in depth order
const all=[...fill.map(f=>({f})),...Object.entries(BL).map(([k,b])=>({k,b}))].sort((A,B)=>{const a=A.f?A.f.g:A.b.g,b=B.f?B.f.g:B.b.g;return a[0]+a[1]-b[0]-b[1]});
hit=[];const tops={};
for(const o of all){if(o.f){const[px,py]=iso(...o.f.g);box(px,py,o.f.w,o.f.h,"#141b24","#0c1118","#0f151d","#e3b34140");continue}
const{k,b}=o,[px,py]=iso(...b.g),c=C[k];let win=c+"aa";if(k=="player"&&vf>0){win="#3fb950";vf-=.004}
const r=box(px,py,b.w,b.h,"#1a2330","#0d131b","#111924",win);hit.push([k,...r]);tops[k]=[px,py-b.h*d*cam.z-b.w*d*cam.z/4];
x.strokeStyle=c+"66";x.strokeRect(r[0],r[1],r[2],r[3]*0);
if(k=="advisor"){const L={green:"#3fb950",yellow:"#d29922",red:"#f85149"}[lv];x.fillStyle=L;x.beginPath();x.arc(px,py-b.h*d*cam.z*.8,6*d*cam.z,0,7);x.fill()}
if(k=="trench dig"){x.fillStyle="#1f262e";x.fillRect(px+28*d*cam.z,py-6*d,22*d*cam.z,12*d*cam.z);x.fillStyle="#8b949e";x.font=`${8*d}px monospace`;x.textAlign="center";x.fillText("🗑 "+(S.dumpster||[]).length,px+39*d*cam.z,py+18*d);
if(S.scanning){x.strokeStyle=c;x.lineWidth=2*d;const sw=Math.sin(t/140)*6*d;x.beginPath();x.moveTo(px-30*d*cam.z,py);x.lineTo(px-22*d*cam.z,py+8*d+sw);x.stroke();x.fillStyle="#3a2f1d";x.beginPath();x.arc(px-30*d*cam.z,py+12*d,5*d,0,7);x.fill()}
if(flare>0){x.fillStyle=`rgba(210,153,34,${flare})`;x.shadowColor=c;x.shadowBlur=20;x.beginPath();x.arc(px,py-(1-flare)*220*d,5*d,0,7);x.fill();x.shadowBlur=0;flare-=.003}}}
neonDraw(t);vigilante(t,tops);
// hub bat-signal
const[hx,hy]=tops.bro;x.fillStyle=lv=="red"?`rgba(248,81,73,${.5+.3*Math.sin(t/250)})`:"#e3b34199";x.beginPath();x.moveTo(hx,hy);x.lineTo(hx-40*d,hy-110*d);x.lineTo(hx+40*d,hy-110*d);x.fill();x.globalAlpha=.25;x.fillStyle=lv=="red"?"#f85149":"#e3b341";x.beginPath();x.ellipse(hx,hy-118*d,48*d,18*d,0,0,7);x.fill();x.globalAlpha=1;
x.fillStyle="#05070a";x.beginPath();x.ellipse(hx,hy-118*d,20*d,7*d,0,0,7);x.fill();
// sky lines + packets
x.setLineDash([3*d,5*d]);x.lineWidth=1*d;for(const k of ["advisor","player","trench dig"]){const[a,b]=tops[k];x.strokeStyle=C[k]+"77";x.beginPath();x.moveTo(hx,hy);x.quadraticCurveTo((hx+a)/2,Math.min(hy,b)-50*d,a,b);x.stroke()}x.setLineDash([]);

const k=p.k,mx=(A[0]+B[0])/2,my=Math.min(A[1],B[1])-50*d,bx=(1-k)**2*A[0]+2*(1-k)*k*mx+k*k*B[0],by=(1-k)**2*A[1]+2*(1-k)*k*my+k*k*B[1];x.fillStyle=C[p.f]||"#fff";x.shadowColor=x.fillStyle;x.shadowBlur=14*d;x.beginPath();x.arc(bx,by,4*d,0,7);x.fill();x.shadowBlur=0}
if(Math.random()<.008&&S.events?.length){const e=S.events[Math.random()*S.events.length|0];pk.push({f:e.agent,to:e.to,k:0})}
// labels
x.font=`${11*d}px monospace`;x.textAlign="left";for(const k in tops){const[a,b]=tops[k],lab=`${NM[k]} · ${BL[k].lab}`,tw=x.measureText(lab).width+22*d,ly=b-(k=="bro"?140:22)*d;x.fillStyle="#05070add";x.fillRect(a-tw/2,ly-13*d,tw,18*d);x.strokeStyle=C[k]+"88";x.strokeRect(a-tw/2,ly-13*d,tw,18*d);x.fillStyle=C[k];x.beginPath();x.arc(a-tw/2+9*d,ly-4*d,3.5*d,0,7);x.fill();x.fillStyle="#e6edf3";x.fillText(lab,a-tw/2+16*d,ly)}
x.strokeStyle="#9fb3c830";x.lineWidth=1;for(const r of drops){r.y+=.012*r.v;if(r.y>1)r.y=0;x.beginPath();x.moveTo(r.x*W,r.y*H);x.lineTo(r.x*W-2*d,r.y*H+11*d);x.stroke()}

// pan/zoom/tap
let drag=null,moved=0,pts=new Map(),pd=0;cv.addEventListener("pointerdown",e=>{pts.set(e.pointerId,e);drag=[e.clientX,e.clientY];moved=0;cv.setPointerCapture(e.pointerId)});
cv.addEventListener("pointermove",e=>{if(!drag)return;if(pts.size==2){pts.set(e.pointerId,e);const[a,b]=[...pts.values()],dd=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pd)cam.z=Math.min(2.5,Math.max(.4,cam.z*dd/pd));pd=dd;moved=99;return}
cam.x+=(e.clientX-drag[0])*d;cam.y+=(e.clientY-drag[1])*d;moved+=Math.abs(e.clientX-drag[0])+Math.abs(e.clientY-drag[1]);drag=[e.clientX,e.clientY]});
cv.addEventListener("pointerup",e=>{pts.delete(e.pointerId);pd=0;if(moved<8){const r=cv.getBoundingClientRect(),X=(e.clientX-r.left)*d,Y=(e.clientY-r.top)*d;for(const[k,a,b,w,h]of hit.slice().reverse())if(X>a&&X<a+w&&Y>b-30*d&&Y<b+h){openA(k);break}}if(!pts.size)drag=null});
cv.addEventListener("wheel",e=>{e.preventDefault();cam.z=Math.min(2.5,Math.max(.4,cam.z*(e.deltaY<0?1.1:.9)))},{passive:false});
const esc=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const evh=e=>`<div class="ev"><i>${esc(e.time)}</i> <b style="color:${C[e.agent]}">${NM[e.agent]||esc(e.agent)}</b> ${esc(e.text)}</div>`;
function office(k){const o=document.createElement("canvas");o.id="office";o.width=160;o.height=45;const q=o.getContext("2d"),c=C[k];q.fillStyle="#0d131b";q.fillRect(0,0,160,45);q.fillStyle="#1a2330";q.fillRect(0,34,160,11);
q.fillStyle="#0b1019";q.fillRect(110,6,40,20);for(let i=0;i<5;i++){q.fillStyle="#e3b34155";q.fillRect(113+i*7,9+(i%2)*6,3,4)}q.fillStyle="#2b3440";q.fillRect(40,24,40,4);q.fillRect(44,28,3,6);q.fillRect(73,28,3,6);
q.fillStyle="#58a6ff55";q.fillRect(52,14,16,10);q.fillStyle=c;q.fillRect(28,16,6,6);q.fillRect(27,22,8,10);q.fillStyle="#9fb3c8";for(let i=0;i<12;i++)q.fillRect((i*37)%110,(i*13)%30,1,3);return o}
function openA(k){const a=S.agents?.[k];if(!a)return;const m=document.getElementById("mp");m.style.setProperty("--c",C[k]);
m.innerHTML=`<span class="x" onclick="document.getElementById('modal').style.display='none'">close</span><h2 style="color:${C[k]}">${NM[k].toUpperCase()} · ${esc(a.role).toUpperCase()}</h2><div class="s">${esc(a.where)} · updated ${esc(a.updated)}</div><div id="ofs"></div><div>${esc(a.activity)}</div><h3>RECENT</h3>${(S.events||[]).filter(e=>e.agent==k).map(evh).join("")||'<div class="s">nothing yet</div>'}`;
document.getElementById("ofs").appendChild(office(k));document.getElementById("modal").style.display="flex"}
document.getElementById("modal").onclick=e=>{if(e.target.id=="modal")e.target.style.display="none"};
async function poll(){try{const r=await fetch("../status.json?"+Date.now());S=await r.json();
for(const e of S.events){const id=e.t+e.text;if(!seen.has(id)){seen.add(id);if(!first){pk.push({f:e.agent,to:e.to,k:0});if(e.kind=="flag")flare=1}}}
if(lt&&S.last_trade_ts!==lt)vf=1;lt=S.last_trade_ts;if(first){S.events.slice(0,5).forEach((e,i)=>pk.push({f:e.agent,to:e.to,k:-i*.3}));if(S.flagged?.length)flare=1}first=false;
document.getElementById("bar").innerHTML=Object.entries(S.agents).map(([k,a])=>`<div class="chip" style="--c:${C[k]}" onclick="openA('${k}')"><b>${NM[k]}</b> ${esc(a.activity)}</div>`).join("");
document.getElementById("ev").innerHTML=S.events.map(evh).join("");
document.getElementById("wait").innerHTML=(S.waiting_on_you||[]).map(w=>`<div class="w">${esc(w)}</div>`).join("")||'<div class="s">nothing — go back to sleep</div>';
document.getElementById("queue").innerHTML=(S.queued_today||[]).map(q=>`<div class="q"><i class="s">${esc(q.time)}</i> ${esc(q.what)}</div>`).join("");
document.getElementById("slept").innerHTML=(S.while_you_slept||[]).map(evh).join("")||'<div class="s">quiet night</div>';
document.getElementById("bags").innerHTML=S.bags.map(b=>`<div>${b.pnl_direction=="up"?'<span class="up">▲</span>':b.pnl_direction=="down"?'<span class="dn">▼</span>':'■'} <b>${esc(b.coin)}</b> <span class="s">${esc(b.mc)}</span></div>`).join("")+`<div class="s" style="margin-top:6px">risk: <b style="color:${{green:"#3fb950",yellow:"#d29922",red:"#f85149"}[S.risk_level]}">${S.risk_level.toUpperCase()}</b></div>`;
document.getElementById("dump").innerHTML=S.dumpster.map(d=>`<div><b>${esc(d.coin)}</b><br><span class="s">${esc(d.reason)}</span></div>`).join("");
document.getElementById("t").textContent="LIVE · "+new Date().toLocaleTimeString()}catch(e){document.getElementById("t").textContent="RECONNECTING"}}
rs();requestAnimationFrame(draw);poll();setInterval(poll,1000);
</script></body></html>
